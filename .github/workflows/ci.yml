name: CI

# Verificación de calidad en el servidor para cada PR.
# Complementa el hook local pre-commit (husky + lint-staged).
on:
  pull_request:
    branches: [develop, main]

# Cancela ejecuciones anteriores del mismo PR si se hace push de nuevos commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
